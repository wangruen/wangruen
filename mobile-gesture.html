<!DOCTYPE html>
<!-- 作者：王如恩 | 建立时间：2026-11-18 | 使用大模型：GLM-5.3-Flash | 功能名称：手势卡片——移动端左右滑动切换中华美食卡片（touchstart/touchend + 40px阈值 + 300ms冷却 + 0.3s过渡动画） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>手势卡片 · 左右滑动切换美食 | 王如恩</title>
  <style>
    /* ===== 页面：整体布局（移动端优先） ===== */
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #1c2333; margin: 0; color: #2c3e50; }
    .wre_page { max-width: 420px; margin: 0 auto; padding: 26px 16px 50px; }
    header.wre_head { text-align: center; margin-bottom: 18px; }
    header.wre_head h1 { margin: 0 0 6px; font-size: 22px; color: #f5f7fa; }
    header.wre_head p { margin: 0; font-size: 13px; color: #8fa0b8; }

    /* ===== 页面：卡片舞台（触摸区域） ===== */
    /* touch-action: pan-y —— 关键规则：横向手势由卡片处理，纵向拖动仍交给浏览器滚动页面（验收③） */
    .wre_stage { overflow: hidden; border-radius: 16px; touch-action: pan-y; box-shadow: 0 6px 24px rgba(0,0,0,0.35); user-select: none; cursor: grab; }
    .wre_stage:active { cursor: grabbing; }
    /* 轨道：4 张卡片横排，靠 transform 位移切换，0.3s 过渡动画（要求5） */
    .wre_track { display: flex; transition: transform 0.3s ease; }
    .wre_slide { min-width: 100%; padding: 34px 24px 30px; box-sizing: border-box; color: #fff; }
    /* 4 道菜各自的渐变背景 */
    .wre_bg1 { background: linear-gradient(135deg, #ff9a56, #ff5f3d); }
    .wre_bg2 { background: linear-gradient(135deg, #ff6b9d, #b23dfd); }
    .wre_bg3 { background: linear-gradient(135deg, #f7b733, #e04f2e); }
    .wre_bg4 { background: linear-gradient(135deg, #43c6ac, #1977b3); }
    .wre_emoji { font-size: 46px; line-height: 1; margin-bottom: 12px; }
    .wre_name { margin: 0 0 8px; font-size: 24px; text-shadow: 0 1px 4px rgba(0,0,0,0.18); }
    .wre_intro { margin: 0; font-size: 14px; line-height: 1.9; opacity: 0.94; }

    /* ===== 页面：页码与边界提示 ===== */
    .wre_indicator { text-align: center; font-size: 15px; color: #f5f7fa; margin-top: 16px; }
    .wre_msg { text-align: center; font-size: 13px; color: #ffd37a; margin-top: 8px; min-height: 20px; transition: opacity 0.3s; }

    /* ===== 页面：滑动方向小提示 ===== */
    footer.wre_foot { text-align: center; color: #8fa0b8; font-size: 12px; margin-top: 26px; line-height: 1.8; }
  </style>
</head>
<body>
<div class="wre_page">
  <header class="wre_head">
    <h1>🥢 中华美食卡片</h1>
    <p>左右滑动切换菜品（手机直接滑，电脑按住鼠标拖）</p>
  </header>

  <!-- 卡片舞台：所有触摸事件绑定在这里；touch-action: pan-y 保证纵向可滚动 -->
  <div class="wre_stage" id="wre_stage">
    <div class="wre_track" id="wre_track">
      <div class="wre_slide wre_bg1">
        <div class="wre_emoji">🌶️</div>
        <h2 class="wre_name">宫保鸡丁</h2>
        <p class="wre_intro">经典川菜，鸡丁滑嫩、花生酥脆，咸鲜微辣带一点酸甜，下饭神器。</p>
      </div>
      <div class="wre_slide wre_bg2">
        <div class="wre_emoji">🍲</div>
        <h2 class="wre_name">麻婆豆腐</h2>
        <p class="wre_intro">麻、辣、烫、香、酥、嫩俱全，豆腐嫩滑不碎，红油亮泽，麻辣鲜香。</p>
      </div>
      <div class="wre_slide wre_bg3">
        <div class="wre_emoji">🦆</div>
        <h2 class="wre_name">北京烤鸭</h2>
        <p class="wre_intro">皮脆肉嫩、色泽枣红，配薄饼、葱丝与甜面酱，一口酥香满嘴留鲜。</p>
      </div>
      <div class="wre_slide wre_bg4">
        <div class="wre_emoji">🥟</div>
        <h2 class="wre_name">上海小笼包</h2>
        <p class="wre_intro">皮薄如纸、褶皱均匀，轻轻一咬汤汁四溢，鲜香满口，讲究"先开窗、后喝汤"。</p>
      </div>
    </div>
  </div>

  <!-- 底部页码：第 X/4 张 -->
  <div class="wre_indicator" id="wre_indicator">第 1/4 张</div>
  <!-- 边界提示：已是第一张/最后一张 -->
  <div class="wre_msg" id="wre_msg"></div>

  <footer class="wre_foot">高级网页设计 · 王如恩 · 24002120528<br>任务二：手势识别 · DOM 操作</footer>
</div>

<script>
  // 模块状态：当前卡片索引、滑动起点、上次切换时间（冷却用）
  var wre_index = 0;        // 当前显示第几张（0 起）
  var wre_total = 4;        // 卡片总数
  var wre_startX = 0;       // touchstart 时手指的横向坐标
  var wre_startY = 0;       // touchstart 时手指的纵向坐标（用于排除纵向滑动）
  var wre_lastSwitch = 0;   // 上一次成功切换的时间戳（300ms 冷却）

  // 功能：根据当前索引更新轨道位移（0.3s 过渡动画由 CSS transition 实现）与底部页码文字
  function wre_updateView() {
    document.getElementById("wre_track").style.transform = "translateX(-" + (wre_index * 100) + "%)";
    document.getElementById("wre_indicator").textContent = "第 " + (wre_index + 1) + "/" + wre_total + " 张";
  }

  // 功能：显示边界/提示文字，1.5 秒后自动淡出清除
  function wre_showHint(wre_text) {
    var wre_el = document.getElementById("wre_msg");
    wre_el.textContent = wre_text;
    wre_el.style.opacity = "1";
    // 功能：延时清除提示（避免提示常驻）
    setTimeout(function () { wre_el.style.opacity = "0"; }, 1500);
  }

  // 功能：核心切换逻辑——300ms 冷却防连滑（验收②），40px 阈值防误触（验收①），越界时给提示（要求3）
  function wre_switch(wre_dir) {
    var wre_now = Date.now();
    if (wre_now - wre_lastSwitch < 300) { return; } // 冷却期内忽略本次切换

    if (wre_dir === "next") {
      if (wre_index >= wre_total - 1) { wre_showHint("已经是最后一张"); return; }
      wre_index += 1;
    } else {
      if (wre_index <= 0) { wre_showHint("已经是第一张"); return; }
      wre_index -= 1;
    }
    wre_lastSwitch = wre_now; // 只有真正切换成功才消耗冷却
    wre_updateView();
  }

  // 功能：记录滑动起点（changedTouches[0] 的 x/y 坐标）
  function wre_touchStart(wre_e) {
    wre_startX = wre_e.changedTouches[0].clientX;
    wre_startY = wre_e.changedTouches[0].clientY;
  }

  // 功能：在 touchend 用 changedTouches[0] 计算横向位移——超过 40px 阈值且横向意图明显才切换；左滑下一张、右滑上一张
  function wre_touchEnd(wre_e) {
    var wre_dx = wre_e.changedTouches[0].clientX - wre_startX; // 横向位移（要求2）
    var wre_dy = wre_e.changedTouches[0].clientY - wre_startY;
    if (Math.abs(wre_dx) < 40) { return; }        // 阈值 40px：短距离误触不切换
    if (Math.abs(wre_dy) > Math.abs(wre_dx)) { return; } // 纵向意图更明显 → 交给页面滚动，不切卡片
    wre_switch(wre_dx < 0 ? "next" : "prev");     // 左滑(位移为负)下一张，右滑上一张
  }

  // 功能：把触摸事件与电脑调试用的鼠标拖拽事件绑定到卡片舞台
  function wre_bindGestures() {
    var wre_stage = document.getElementById("wre_stage");
    // 手机端：touchstart / touchend 监听
    wre_stage.addEventListener("touchstart", wre_touchStart, { passive: true });
    wre_stage.addEventListener("touchend", wre_touchEnd);
    wre_stage.addEventListener("touchcancel", function () {}); // 浏览器接管滚动时静默取消，避免误切
    // 电脑调试：mousedown / mouseup 走同一套起点记录与位移判断逻辑
    var wre_mouseDown = false;
    wre_stage.addEventListener("mousedown", function (wre_e) {
      wre_mouseDown = true;
      wre_startX = wre_e.clientX;
      wre_startY = wre_e.clientY;
    });
    wre_stage.addEventListener("mouseup", function (wre_e) {
      if (!wre_mouseDown) { return; }
      wre_mouseDown = false;
      var wre_dx = wre_e.clientX - wre_startX;
      var wre_dy = wre_e.clientY - wre_startY;
      if (Math.abs(wre_dx) < 40 || Math.abs(wre_dy) > Math.abs(wre_dx)) { return; }
      wre_switch(wre_dx < 0 ? "next" : "prev");
    });
  }

  // 功能：页面加载完成后绑定手势事件并显示初始状态
  window.addEventListener("DOMContentLoaded", function () {
    wre_bindGestures();
    wre_updateView();
  });
</script>
</body>
</html>
