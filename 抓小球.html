<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球 | 函数的三个方法</title>
     <style>
        body{
            background: #f0f8ff;
            overflow: hidden;
            font-size: 24px;
            margin:0;
        }
        #info{
            padding: 16px;
            background: #222;
            color: #fff;
        }
        .ball{
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            /* ✅ 加上这一行！绝对定位，top left才能控制位置 */
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="info">当前分数：<span id="score">0</span></div>
    <div class="ball" id="ball"></div>
    
    <script>
        // cost-变量引用的地址不能改
        const game = {
            score: 0,
            ballDom: document.getElementById("ball"),
            width: 50,
            height: 50
        };
        //需要什么函数: 小球移动、小球点击、空白点击、更新分数
        function moveBall(){
            // 保证小球在屏幕内
            const maxX = window.innerWidth - game.width;
            const maxY = window.innerHeight - game.height;
            // 小球随机位置是0-窗口宽度取整
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            // 移动小球
            game.ballDom.style.top = randomY + "px";
            game.ballDom.style.left = randomX + "px";
        }
        // 更新分数
        // 普通的函数存在函数提升：函数体在后面，函数的调用在前面
        // this、arguments：类数字对象，函数在调用时候传递过来的是参数子对象
        function updateScore(){
            //function updateScore(a,b)
            // a=aguments[0]
           // b=arguments[1]
            document.getElementById("score").innerText = game.score;
        }
        game.ballDom.addEventListener("click", function(e){
        // 匿名函数 有this 
        game.score += 1;
        updateScore();
        moveBall();
        // 阻止冒泡，避免触发body的miss扣分
        e.stopPropagation();
       });
       //点击空白区域扣分
       document.body.addEventListener("click", function(e){
        if(e.target !== game.ballDom){
            game.score -= 1;
            updateScore();
        }
        });
        // ✅ 页面加载完成，初始化小球位置
        moveBall();
    </script>
</body>
</html>
