<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼多多首页模块</title>
    <!-- 引入外部css文件 -->
    <link rel="stylesheet" href="..//css/24002120528.王如恩.style.css">
</head>
<body>
<!-- 顶部搜索区域 -->
<div class="wre_header">
    <div class="wre_search-box">
        <input class="wre_search-input" placeholder="搜索商品" />
    </div>
</div>

<!-- Tab标签导航 -->
<div class="wre_tab-wrap">
    <div class="wre_tab-item active">推荐</div>
    <div class="wre_tab-item">11周年庆</div>
    <div class="wre_tab-item">食品</div>
    <div class="wre_tab-item">服饰</div>
    <div class="wre_tab-item">数码</div>
    <div class="wre_tab-item">家居</div>
</div>

<!-- 功能图标模块：限时秒杀、多多买菜等 -->
<div class="wre_icon-wrap">
    <div class="wre_icon-item">
        <img class="wre_icon-img" src="..//img/限时秒杀.jpg" alt="限时秒杀">
        <span>限时秒杀</span>
    </div>
    <div class="wre_icon-item">
        <img class="wre_icon-img" src="..//img/多多买菜.jpg" alt="多多买菜">
        <span>多多买菜</span>
    </div>
    <div class="wre_icon-item">
        <img class="wre_icon-img" src="..//img/现金大转盘.jpg" alt="现金大转盘">
        <span>现金大转盘</span>
    </div>
    <div class="wre_icon-item">
        <img class="wre_icon-img" src="..//img/多多果园.jpg" alt="多多果园">
        <span>多多果园</span>
    </div>
     <div class="wre_icon-item">
        <img class="wre_icon-img" src="..//img/拼小圈.jpg" alt="拼小圈">
        <span>拼小圈</span>
    </div>
</div>
<!-- 百亿补贴横滑区 -->
<div class="wre_billion-wrap">

    <!-- 左上角栏目标识 -->
    <div class="wre_billion-header">
        <span class="wre_billion-logo">百亿补贴</span>
    </div>

    <!-- 横向商品列表 -->
    <div class="wre_billion-list">

        <!-- 商品卡片 1 -->
        <div class="wre_billion-item">
            <div class="wre_billion-img">
                <img src="..//img/钟离.jpg" alt="商品图片">
            </div>
            <div class="wre_billion-price">¥19.9</div>
        </div>

        <!-- 商品卡片 2 -->
        <div class="wre_billion-item">
            <div class="wre_billion-img">
                <img src="..//img/帽子.jpg" alt="商品图片">
            </div>
            <div class="wre_billion-price">¥83.25</div>
        </div>

        <!-- 商品卡片 3 -->
        <div class="wre_billion-item">
            <div class="wre_billion-img">
                <img src="..//img/溏心蛋.jpg" alt="商品图片">
            </div>
            <div class="wre_billion-price">¥6.99</div>
        </div>

        <!-- 商品卡片 4 -->
        <div class="wre_billion-item">
            <div class="wre_billion-img">
                <img src="..//img/洁面乳.jpg" alt="商品图片">
            </div>
            <div class="wre_billion-price">¥9.9</div>
        </div>

    </div>
</div>

<!-- 商品网格列表区域 -->
<div class="wre_goods-wrap">
    <!-- 商品卡片1 -->
    <div class="wre_goods-item">
        <div class="wre_goods-img">
            <img src="..//img/可爱帽.jpg" alt="商品图">
        </div>
        <div class="wre_goods-name">日系可爱八角帽</div>
        <div class="wre_goods-price">¥17.35</div>
        <div class="wre_goods-sold">本店已拼27万件</div>
    </div>
    <!-- 商品卡片2 -->
    <div class="wre_goods-item">
        <div class="wre_goods-img">
            <img src="..//img/苹果笔.jpg" alt="商品图">
        </div>
        <div class="wre_goods-name">新款苹果直液中性笔ins风</div>
        <div class="wre_goods-price">¥2.99</div>
        <div class="wre_goods-sold">本店已拼127万+件</div>
    </div>
    <!-- 商品卡片3 -->
    <div class="wre_goods-item">
        <div class="wre_goods-img">
            <img src="..//img/芒果巧克力.jpg" alt="商品图">
        </div>
        <div class="wre_goods-name">厚切芒果黑巧克力</div>
        <div class="wre_goods-price">¥5.8</div>
        <div class="wre_goods-sold">本店已拼8.6万件</div>
    </div>
    <!-- 商品卡片4 -->
    <div class="wre_goods-item">
        <div class="wre_goods-img">
            <img src="..//img/鸭子挂件.jpg" alt="商品图">
        </div>
        <div class="wre_goods-name">毛绒小黄鸭挂件玩偶</div>
        <div class="wre_goods-price">¥3.2</div>
        <div class="wre_goods-sold">本店已拼16万件</div>
    </div>
</div>


<!-- 底部导航栏 -->
<div class="wre_footer-nav">
    <div class="wre_nav-item active">
        <div class="wre_nav-icon">🏠</div>
        <div class="wre_nav-text">首页</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">🔍</div>
        <div class="wre_nav-text">搜索</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">🛒</div>
        <div class="wre_nav-text">多多买菜</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">📋</div>
        <div class="wre_nav-text">订单</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">👤</div>
        <div class="wre_nav-text">个人中心</div>
    </div>
</div>

</body>
</html>
