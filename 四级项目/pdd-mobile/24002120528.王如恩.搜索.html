<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品搜索页</title>
    <link rel="stylesheet" href="..//css/24002120528.王如恩.style.css">
</head>
<body>
<!-- 顶部搜索区域 -->
<div class="wre_search-page-header">
    <div class="wre_search-back">←</div>
    <div class="wre_search-input-wrap">
        <input class="wre_search-input" value="帽子百搭">
    </div>
    <div class="wre_search-help">帮你选</div>
</div>

<!-- 筛选tab -->
<div class="wre_filter-tab">
    <div class="wre_filter-item active">综合 ▾</div>
    <div class="wre_filter-item">销量</div>
    <div class="wre_filter-item">价格 ⇅</div>
    <div class="wre_filter-item">品牌</div>
    <div class="wre_filter-item">筛选 ☰</div>
</div>

<!-- 标签横向滚动 -->
<div class="wre_tag-scroll">
    <div class="wre_tag-item active">百亿补贴</div>
    <div class="wre_tag-item">🔥11周年庆</div>
    <div class="wre_tag-item">回头客常拼</div>
    <div class="wre_tag-item">鸭舌帽</div>
</div>

<!-- 帽子分类横向图标区 -->
<div class="wre_cap-type-wrap">
    <div class="wre_cap-item">
        <div class="wre_cap-img"><img src="..//img/八角帽.jpg" alt="八角帽"></div>
        <div class="wre_cap-text">八角帽</div>
    </div>
    <div class="wre_cap-item">
        <div class="wre_cap-img"><img src="..//img/棒球帽.jpg" alt="棒球帽"></div>
        <div class="wre_cap-text">棒球帽</div>
    </div>
    <div class="wre_cap-item">
        <div class="wre_cap-img"><img src="..//img/户外帽.jpg" alt="户外帽"></div>
        <div class="wre_cap-text">户外帽</div>
    </div>
    <div class="wre_cap-item">
        <div class="wre_cap-img"><img src="..//img/冷帽.jpg" alt="冷帽"></div>
        <div class="wre_cap-text">冷帽</div>
    </div>
    <div class="wre_cap-item">
        <div class="wre_cap-img"><img src="..//img/空顶帽.jpg" alt="空顶帽"></div>
        <div class="wre_cap-text">空顶帽</div>
    </div>
</div>

<!-- 双列商品网格 -->
<div class="wre_search_goods-wrap">
    <div class="wre_search_goods-item">
        <div class="wre_search_goods-img">
            <img src="..//img/INXX.jpg" alt="商品">
        </div>
        <div class="wre_search_goods-tags">
            <span class="wre_tag_buy">百亿补贴</span>
            <span class="wre_tag_brand">品牌</span>
            <span>INXX STREE</span>
        </div>
        <div class="wre_search_goods-desc">24小时内80+人拼单 正品险</div>
        <div class="wre_search_goods-price">¥19.9 <span class="wre_search_goods-sold">本店已拼10.6万+件</span></div>
    </div>
    <div class="wre_search_goods-item">
        <div class="wre_search_goods-img">
            <img src="..//img/复古星星.jpg" alt="商品">
        </div>
        <div class="wre_search_goods-name">日系复古格子星星八角帽</div>
        <div class="wre_search_goods-tags">
            <span class="wre_tag_limit">限时9.5折</span>
            <span>00:59:19.4</span>
        </div>
        <div class="wre_search_goods-price">限时¥9.17 <span class="wre_search_goods-sold">本店已拼2392件</span></div>
    </div>
    <div class="wre_search_goods-item">
        <div class="wre_search_goods-img">
            <img src="..//img/渔夫帽.jpg" alt="商品">
        </div>
        <div class="wre_search_goods-name">日系复古牛仔渔夫帽女20</div>
        <div class="wre_search_goods-desc">620人收藏 🟢先用后付</div>
        <div class="wre_search_goods-price">¥xx.xx</div>
    </div>
    <div class="wre_search_goods-item">
        <div class="wre_search_goods-img">
            <img src="..//img/碎花.jpg" alt="商品">
        </div>
        <div class="wre_search_goods-name">2026春秋款牛仔纯色小碎</div>
        <div class="wre_search_goods-desc">我收藏过 🟢先用后付 已包邮</div>
        <div class="wre_search_goods-price">¥xx.xx</div>
    </div>
</div>

<!--底部导航栏-->
<div class="wre_footer-nav">
    <div class="wre_nav-item">
        <div class="wre_nav-icon">🏠</div>
        <div class="wre_nav-text">首页</div>
    </div>
    <div class="wre_nav-item active">
        <div class="wre_nav-icon">🔍</div>
        <div class="wre_nav-text">搜索</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">🛒</div>
        <div class="wre_nav-text">多多买菜</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">📋</div>
        <div class="wre_nav-text">订单</div>
    </div>
    <div class="wre_nav-item">
        <div class="wre_nav-icon">👤</div>
        <div class="wre_nav-text">个人中心</div>
    </div>
</div>
</body>
</html>
