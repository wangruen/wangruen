<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情页</title>
    <link rel="stylesheet" href="..//css/24002120528.王如恩.style.css">
</head>
<body>

<!-- 顶部导航栏 -->
<div class="wre_detail-topbar">
    <div class="wre_detail-back">←</div>
    <div class="wre_detail-title">帽子详情</div>
    <div class="wre_detail-share">分享</div>
</div>

<!-- 商品大图区 -->
<div class="wre_detail-img-wrap">
    <img src="..//img/主图.jpg" alt="商品主图">
</div>

<!-- 价格信息区 -->
<div class="wre_detail-price-box">
    <div class="wre_detail-price-row">
        <span class="wre_detail-price-now">券后¥57</span>
        <span class="wre_detail-price-old">¥69</span>
        <span class="wre_detail-coupon">券2元</span>
    </div>
    <div class="wre_detail-promotion">
        <span class="wre_detail-promotion-tag">11周年庆</span>
        关注店铺送2元券，店铺会员满59减5，满129减7
    </div>
</div>

<!-- 优惠标签区 -->
<div class="wre_detail-benefit-wrap">
    <div class="wre_detail-benefit-title">优惠信息</div>
    <div class="wre_detail-benefit-list">
        <div class="wre_detail-benefit-item red">先用后付</div>
        <div class="wre_detail-benefit-item red">支持0元下单</div>
        <div class="wre_detail-benefit-item">确认收货后再付款</div>
        <div class="wre_detail-benefit-item">店铺会员满59减5</div>
        <div class="wre_detail-benefit-item">满129减7</div>
        <div class="wre_detail-benefit-item">包邮</div>
    </div>
</div>

<!-- 商品商品标题区 -->
<div class="wre_detail-name-box">
    <div class="wre_detail-name">九尾杂货店木染家渔夫帽甜美可爱简约秋冬款百搭出行必备休闲百搭</div>
    <div class="wre_detail-subtitle">5年老店 · 已售8.6万件 · 包邮</div>
</div>

<!-- 店铺信息区 -->
<div class="wre_detail-shop-wrap">
    <div class="wre_detail-shop-left">
        <div class="wre_detail-shop-logo">
            <img src="..//img/logo.jpg" alt="店铺logo">
        </div>
        <div>
            <div class="wre_detail-shop-name">九尾杂货店配饰旗舰店</div>
            <div class="wre_detail-shop-desc">5年老店</div>
        </div>
    </div>
    <div class="wre_detail-shop-btn">进店</div>
</div>

<!-- 详情图展示区 -->
<div class="wre_detail-desc-wrap">
    <div class="wre_detail-desc-title">商品详情</div>
    <div class="wre_detail-desc-img">
        <img src="..//img/详情1.jpg" alt="详情图1">
        <img src="..//img/详情2.jpg" alt="详情图2">
        <img src="..//img/详情3.jpg" alt="详情图3">
    </div>
</div>

<!-- 底部操作栏 -->
<div class="wre_detail-footer">
    <div class="wre_detail-footer-left">
        <div class="wre_detail-footer-item">
            <div class="wre_detail-footer-icon">💬</div>
            <div>客服</div>
        </div>
        <div class="wre_detail-footer-item">
            <div class="wre_detail-footer-icon">⭐</div>
            <div>收藏</div>
        </div>
    </div>
    <div class="wre_detail-footer-right">
        <button class="wre_detail-btn-cart">加入购物车</button>
        <button class="wre_detail-btn-buy">立即购买</button>
    </div>
</div>

</body>
</html>
