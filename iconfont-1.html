<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICON GALLERY · Font Awesome</title>
    <!-- 本地 Font Awesome CSS（字体图标方式） -->
    <link rel="stylesheet" href="./cdn/font-awesome/css/all.min.css">
    <style>
        /* ========== 艺术品牌风 · 设计变量 ========== */
        :root {
            --wr-bg:        #0f0f12;
            --wr-surface:   #1a1a20;
            --wr-surface-2: #24242c;
            --wr-ink:       #f4f1ea;
            --wr-ink-soft:  #b8b4aa;
            --wr-gold:      #c9a96a;
            --wr-gold-hi:   #e8d4a0;
            --wr-line:      rgba(244, 241, 234, 0.08);
            --wr-line-hi:   rgba(244, 241, 234, 0.18);
            --wr-shadow:    0 8px 30px rgba(0, 0, 0, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--wr-bg);
            color: var(--wr-ink);
            font-family: "Inter", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            font-feature-settings: "ss01", "cv11";
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .wr_nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 56px;
            background: rgba(15, 15, 18, 0.72);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border-bottom: 1px solid var(--wr-line);
        }

        .wr_brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: "Playfair Display", Georgia, "Songti SC", "STSong", serif;
            font-size: 22px;
            letter-spacing: 0.08em;
            color: var(--wr-gold-hi);
        }

        .wr_brand i { font-size: 18px; }

        .wr_nav_links { display: flex; gap: 28px; }
        .wr_nav_links a {
            color: var(--wr-ink-soft);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .wr_nav_links a:hover { color: var(--wr-gold-hi); }
        .wr_nav_links .wr_active { color: var(--wr-gold-hi); }

        /* Hero */
        .wr_hero {
            padding: 88px 56px 56px;
            text-align: center;
            max-width: 960px;
            margin: 0 auto;
        }

        .wr_hero_tag {
            display: inline-block;
            padding: 6px 18px;
            border: 1px solid var(--wr-line-hi);
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--wr-gold);
            margin-bottom: 28px;
        }

        .wr_hero h1 {
            font-family: "Playfair Display", Georgia, "Songti SC", "STSong", serif;
            font-size: clamp(38px, 7vw, 76px);
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.05;
            margin-bottom: 22px;
            color: var(--wr-ink);
        }

        .wr_hero h1 em {
            font-style: italic;
            color: var(--wr-gold-hi);
        }

        .wr_hero p {
            font-size: 16px;
            color: var(--wr-ink-soft);
            max-width: 560px;
            margin: 0 auto;
            letter-spacing: 0.02em;
        }

        /* 分类 */
        .wr_section {
            padding: 48px 56px;
            max-width: 1240px;
            margin: 0 auto;
        }

        .wr_section_header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--wr-line);
        }

        .wr_section_header h2 {
            font-family: "Playfair Display", Georgia, "Songti SC", "STSong", serif;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .wr_section_header .wr_count {
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--wr-ink-soft);
        }

        /* 图标网格 */
        .wr_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .wr_icon_card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 28px 16px 22px;
            background: var(--wr-surface);
            border: 1px solid var(--wr-line);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(.2,.7,.2,1),
                        border-color 0.3s ease,
                        background 0.3s ease,
                        box-shadow 0.35s ease;
            overflow: hidden;
        }

        .wr_icon_card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 80% at 50% 0%, rgba(201,169,106,0.14), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .wr_icon_card:hover {
            transform: translateY(-4px);
            border-color: var(--wr-gold);
            box-shadow: var(--wr-shadow);
            background: var(--wr-surface-2);
        }
        .wr_icon_card:hover::before { opacity: 1; }

        .wr_icon_card i {
            font-size: 32px;
            color: var(--wr-gold-hi);
            transition: transform 0.4s cubic-bezier(.2,.7,.2,1);
        }
        .wr_icon_card:hover i { transform: scale(1.12); }

        .wr_icon_card .wr_label {
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--wr-ink-soft);
            text-align: center;
            word-break: break-all;
            max-width: 100%;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        /* 复制提示 */
        .wr_toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 24px;
            background: var(--wr-gold);
            color: var(--wr-bg);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
        }
        .wr_toast.wr_show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 页脚 */
        .wr_footer {
            padding: 60px 56px 40px;
            text-align: center;
            border-top: 1px solid var(--wr-line);
            margin-top: 40px;
            color: var(--wr-ink-soft);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .wr_footer a {
            color: var(--wr-gold);
            text-decoration: none;
        }
        .wr_footer a:hover { color: var(--wr-gold-hi); text-decoration: underline; }

        /* 响应式 */
        @media (max-width: 720px) {
            .wr_nav, .wr_hero, .wr_section, .wr_footer {
                padding-left: 24px;
                padding-right: 24px;
            }
            .wr_nav { flex-direction: column; gap: 14px; }
            .wr_grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="wr_nav">
        <div class="wr_brand"><i class="fa-solid fa-feather-pointed"></i> ATELIER · ICONS</div>
        <div class="wr_nav_links">
            <a href="./index.html">首页</a>
            <a href="./iconfont-1.html" class="wr_active">Font Awesome</a>
            <a href="./inconfont-2.html">Lucide</a>
        </div>
    </nav>

    <!-- Hero -->
    <header class="wr_hero">
        <div class="wr_hero_tag">Vol. 01 — Typographic Icons</div>
        <h1>When glyphs become <em>art</em>.</h1>
        <p>精选 Font Awesome 图标集，以字体形式优雅呈现。点击任意图标即可复制其 class 名称。</p>
    </header>

    <!-- Solid 图标 -->
    <section class="wr_section">
        <div class="wr_section_header">
            <h2>Solid · 实心</h2>
            <span class="wr_count" id="wr_solid_count">0</span>
        </div>
        <div class="wr_grid" id="wr_solid_grid"></div>
    </section>

    <!-- Regular 图标 -->
    <section class="wr_section">
        <div class="wr_section_header">
            <h2>Regular · 常规</h2>
            <span class="wr_count" id="wr_regular_count">0</span>
        </div>
        <div class="wr_grid" id="wr_regular_grid"></div>
    </section>

    <!-- Brands 图标 -->
    <section class="wr_section">
        <div class="wr_section_header">
            <h2>Brands · 品牌</h2>
            <span class="wr_count" id="wr_brands_count">0</span>
        </div>
        <div class="wr_grid" id="wr_brands_grid"></div>
    </section>

    <!-- Footer：返回首页入口 -->
    <footer class="wr_footer">
        <p>
            <a href="./index.html">← 返回首页</a>
            &nbsp;&nbsp;·&nbsp;&nbsp;
            Font Awesome 6.5.2 · Licensed CC BY 4.0 / SIL OFL 1.1 / MIT
        </p>
    </footer>

    <!-- 复制提示 -->
    <div class="wr_toast" id="wr_toast">Copied ✓</div>

        const wr_regularIcons = [
            "star","heart","bookmark","flag","bell","envelope","envelope-open",

        const wr_brandsIcons = [
            "github","gitlab","bitbucket","npm","yarn","python","js","react","vuejs","angular","node-js","docker","aws","google","google-play","google-drive","google-scholar","youtube","youtube-square","twitter","x-twitter","facebook","facebook-f","facebook-messenger","instagram","linkedin","linkedin-in","tiktok","weixin","weibo","qq","zhihu","bilibili","whatsapp","telegram","signal","discord","slack","slack-hash","spotify","apple","apple-pay","amazon","microsoft","windows","playstation","xbox","dribbble","behance","pinterest","pinterest-p","tumblr","quora","reddit","stack-overflow","stack-exchange","dropbox","medium","vimeo","viber","line","skype","yahoo","yelp","product-hunt","hackerrank","codepen","jsfiddle","free-code-camp","dev","blogger","weebly","wix","squarespace","font-awesome","fonticons","fort-awesome","creative-commons","creative-commons-by","creative-commons-nc","creative-commons-nd","creative-commons-pd","creative-commons-remix","creative-commons-share","creative-commons-zero","cc-visa","cc-mastercard","cc-amex","cc-discover","cc-paypal","apple-pay","google-pay","stripe","paypal","cc-jcb","cc-diners-club"
        ];

        /* ========== 渲染逻辑 ========== */
        function wr_renderIcons(list, prefix, gridId, countId) {
            const grid = document.getElementById(gridId);
            const count = document.getElementById(countId);
            const frag = document.createDocumentFragment();
            list.forEach(name => {
                const card = document.createElement("div");
                card.className = "wr_icon_card";
                card.dataset.class = prefix + name;

                const icon = document.createElement("i");
                icon.className = prefix + name;

                const label = document.createElement("div");
                label.className = "wr_label";
                label.textContent = name;

                card.appendChild(icon);
                card.appendChild(label);

                card.addEventListener("click", () => {
                    const wr_fullClass = prefix + name;
                    navigator.clipboard.writeText(wr_fullClass).then(() => wr_showToast(wr_fullClass));
                });

                frag.appendChild(card);
            });
            grid.appendChild(frag);
            count.textContent = list.length + " glyphs";
        }

        function wr_showToast(text) {
            const toast = document.getElementById("wr_toast");
            toast.textContent = "Copied: <" + text + ">";
            toast.classList.add("wr_show");
            clearTimeout(window.wr_toastTimer);
            window.wr_toastTimer = setTimeout(() => toast.classList.remove("wr_show"), 1600);
        }

        wr_renderIcons(wr_solidIcons,  "fa-solid ",  "wr_solid_grid",  "wr_solid_count");
        wr_renderIcons(wr_regularIcons,"fa-regular ","wr_regular_grid","wr_regular_count");
        wr_renderIcons(wr_brandsIcons, "fa-brands ", "wr_brands_grid", "wr_brands_count");
    </script>

</html>
