<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对象的应用</title>
</head>
<body>
    <!-- 个人明信片的案例：明信片中包含属性和方法，贴近大学生生活 -->
    <script>
        const studentCard = {
            name: "张三",
            age: 18,
            sex: "男",
            hobby: ["篮球", "足球", "羽毛球"],
            grade: "大三",
            // 方法
            introduce: function () {
                // 反引号可以嵌入表达式，this指向当前对象${}这个就是要嵌入的变量
                return `我的名字叫：${this.name}，年龄：${this.age}，性别：${this.sex}，爱好：${this.hobby}`;
            },
            upgrade: function () {
                const grades = ["大一", "大二", "大三", "大四"];
                const index = grades.indexOf(this.grade);
                // 下面可以继续写升级年级逻辑
                if(index !== -1 && index < grades.length -1){
                    this.grade = grades[index + 1];
                }
            }
        }
        console.log(studentCard.introduce());
        studentCard.upgrade();
        console.log(studentCard.grade);
    </script>
</body>
</html>
